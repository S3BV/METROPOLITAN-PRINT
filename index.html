<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metropolitan Print</title>

  <!-- Tailwind CSS (utility-first CSS framework, cargado desde CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* Paleta de colores personalizados para Tailwind */
    tailwind.config = {
      theme: { extend: { colors: {
        bg:'#18191f',      /* fondo principal de la app */
        nav:'#111116',     /* barra de navegación */
        surface:'#1d1e26', /* panel derecho */
        border:'#28293a',  /* bordes de tarjetas */
        muted:'#545e6a',   /* texto secundario */
        subtle:'#2c3040',  /* texto muy tenue */
      }}}
    }
  </script>

  <style>
    /* ── Botones de navegación ── */
    .btn { padding:5px 14px; border-radius:6px; border:1px solid transparent; background:none; color:#545e6a; font-size:13px; font-weight:500; cursor:pointer; transition:all .15s }
    .btn:hover { color:#c0cad4; background:rgba(255,255,255,.05) }
    .btn.active { color:#00d4ff; background:rgba(0,212,255,.08); border-color:rgba(0,212,255,.22) }

    /* ── Componentes del panel de detalle ── */
    .d-bar  { height:10px; background:#13141c; border-radius:6px; overflow:hidden }
    .d-fill { height:100%; border-radius:6px; transition:width .6s cubic-bezier(.4,0,.2,1) }
    .d-card { background:#14151e; border:1px solid #28293a; border-radius:8px; padding:14px }
    .d-tag  { font-size:10px; color:#363d48; font-weight:700; text-transform:uppercase; letter-spacing:.1em; margin-bottom:12px }

    /* ── Tabla de impresoras ── */
    .p-table{width:100%;border-collapse:collapse;font-size:12px}
    .p-table th{padding:7px 10px;text-align:left;color:#545e6a;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid #28293a;white-space:nowrap}
    .p-table td{padding:7px 10px;border-bottom:1px solid #1a1b22;vertical-align:middle;color:#b0bac4}
    .p-table tr:last-child td{border-bottom:none}
    .p-table tr:hover td{background:rgba(255,255,255,.025)}

    /* ── Modal agregar / editar impresora ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:center;justify-content:center}
    .modal-box{background:#1d1e26;border:1px solid #28293a;border-radius:12px;padding:24px;width:500px;max-height:90vh;overflow-y:auto}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    .form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:0}
    .form-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#545e6a}
    .form-input{background:#13141c;border:1px solid #28293a;border-radius:6px;padding:7px 10px;color:#c0cad4;font-size:13px;outline:none;transition:border-color .15s;width:100%;box-sizing:border-box}
    .form-input:focus{border-color:rgba(0,212,255,.5)}

    /* ── Botones de acción en filas de tabla ── */
    .act-btn{padding:3px 7px;border-radius:4px;border:1px solid #28293a;background:none;color:#545e6a;font-size:11px;cursor:pointer;transition:all .15s;margin-left:3px}
    .act-btn:hover{border-color:#3a4050;color:#c0cad4}
    .act-btn.danger:hover{border-color:#d42020;color:#d42020}
  </style>

  <!-- Three.js r160 + Supabase JS v2 vía ES module importmap -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
    }
  }
  </script>
</head>

<!-- h-screen overflow-hidden: la app ocupa exactamente la ventana, sin scroll de página -->
<body class="bg-bg text-[#c0cad4] h-screen overflow-hidden font-[system-ui,sans-serif]">

<!-- ── Barra de navegación superior ── -->
<nav class="h-12 bg-nav border-b border-[#26272f] flex items-center px-5 gap-0.5">
  <button class="btn">Dashboard</button>
  <button class="btn active">Por piso</button>
  <button class="btn">Historial</button>
</nav>

<!-- ── Contenido principal: columna 3D + panel de detalle ── -->
<div class="flex gap-4 p-4 h-[calc(100vh-48px)]">

  <!-- Columna izquierda: canvas Three.js del edificio (ancho fijo 380px) -->
  <div id="three-wrap" class="shrink-0 w-[380px] rounded-xl overflow-hidden relative bg-[#0c1018]">

    <!-- Leyenda de colores superpuesta (esquina inferior izquierda) -->
    <div class="absolute bottom-4 left-4 z-10 flex flex-col gap-1.5 pointer-events-none">
      <div class="flex items-center gap-1.5 text-[11px] text-muted font-medium"><div class="w-2 h-2 rounded-sm bg-[#00c46a]"></div>≥ 80%</div>
      <div class="flex items-center gap-1.5 text-[11px] text-muted font-medium"><div class="w-2 h-2 rounded-sm bg-[#ffa000]"></div>≥ 40%</div>
      <div class="flex items-center gap-1.5 text-[11px] text-muted font-medium"><div class="w-2 h-2 rounded-sm bg-[#d42020]"></div>&lt; 40%</div>
      <div class="flex items-center gap-1.5 text-[11px] text-muted font-medium"><div class="w-2 h-2 rounded-sm bg-[#1a3060] border border-[#2a4880]"></div>Sin datos</div>
    </div>

    <!-- Hint de controles de cámara (esquina superior derecha) -->
    <div class="absolute top-3 right-3 z-10 text-[10px] text-[#2a3040] pointer-events-none text-right leading-5">Scroll · zoom<br>Drag · rotar</div>
  </div>

  <!-- Columna derecha: panel de detalle del piso seleccionado (ocupa el resto del ancho) -->
  <div class="flex-1 bg-surface border border-border rounded-xl overflow-hidden relative">

    <!-- Estado vacío: se muestra hasta que el usuario haga clic en un piso -->
    <div id="placeholder" class="absolute inset-0 flex items-center justify-center gap-2.5 text-subtle text-sm pointer-events-none transition-opacity duration-200">
      <span class="text-xl opacity-40">←</span>
      <span>Haz clic en un piso del edificio</span>
    </div>

    <!-- Contenedor del detalle (invisible por defecto, se muestra al seleccionar piso) -->
    <div id="detail" class="absolute inset-0 p-7 overflow-y-auto opacity-0 pointer-events-none transition-opacity duration-300"></div>
  </div>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }  from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createClient }   from '@supabase/supabase-js';

// ── Supabase ──────────────────────────────────────────────────
const db = createClient(
  'https://vasuhcscqptqreqkviqk.supabase.co',
  'sb_publishable_tPDWqPPhEQPq773IdPGjPA__SQi-iZU'
);

// ── Printer data (sincronizado con Supabase) ──────────────────
let PRINTERS = [];
const { data: _initPrinters, error: _initErr } = await db
  .from('impresoras').select('*').order('created_at');
if (_initErr) console.error('Supabase load error:', _initErr);
else PRINTERS = _initPrinters ?? [];
const PESTADOS = {
  'Planificada':    { color:'#6b7280', bg:'rgba(107,114,128,.14)' },
  'En instalación': { color:'#3b82f6', bg:'rgba(59,130,246,.14)'  },
  'Instalada':      { color:'#f59e0b', bg:'rgba(245,158,11,.14)'  },
  'Configurada':    { color:'#f97316', bg:'rgba(249,115,22,.14)'  },
  'Operativa':      { color:'#22c55e', bg:'rgba(34,197,94,.14)'   },
};
const PESTADO_LIST = Object.keys(PESTADOS);

// Peso numérico de cada estado para calcular % de avance por piso
const ESTADO_PESO = { 'Planificada':0, 'En instalación':25, 'Instalada':50, 'Configurada':75, 'Operativa':100 };

// Retorna el % de avance real del piso según los estados de sus impresoras
function floorEffectiveP(floorId) {
  const ps = PRINTERS.filter(p => p.piso === floorId);
  if (!ps.length) return 0;
  return Math.round(ps.reduce((s, p) => s + (ESTADO_PESO[p.estado] ?? 0), 0) / ps.length);
}

// ── Data ──────────────────────────────────────────────────────
const FLOORS = [
  { id:'S2', p:0 }, { id:'S1', p:0 },
  { id:'1',  p:0 }, { id:'2',  p:0 },
  { id:'3',  p:0 }, { id:'4',  p:0 },
  { id:'5',  p:0 }, { id:'6',  p:0 },
  { id:'7',  p:78, yellow:true }, { id:'8',  p:0 },
  { id:'9',  p:0 }, { id:'10', p:0 },
  { id:'11', p:0 }, { id:'12', p:0 }, { id:'13', p:0 },
  { id:'14', p:0 }, { id:'15', p:0 }, { id:'16', p:0 },
  { id:'17', p:0 }, { id:'18', p:0 }, { id:'19', p:0 },
  { id:'20', p:0 }, { id:'21', p:0 }, { id:'22', p:0 },
  { id:'23', p:0 }, { id:'24', p:0 }, { id:'25', p:0 },
];
const N = FLOORS.length;

// ── Constantes del edificio ───────────────────────────────────
const FH   = 0.28;    // altura estándar del vidrio por piso
const BH   = 0.09;    // altura del spandrel entre pisos
const STEP = FH + BH; // paso por nivel (referencia)
const BW   = 3.6;     // ancho base del edificio ← modificar aquí
const BD   = 2.8;     // profundidad del edificio ← modificar aquí

// ── Forma trapezoidal del edificio ─────────────────────────────
// Pisos 1-5:   trapecio invertido (frente estrecho, fondo ancho) — como el edificio real
// Pisos 6-21:  rectangular (cuerpo central de la torre)
// Pisos 22-25: trapecio normal (frente ancho, fondo estrecho) — corona del edificio
const TRAP_TAPER   = 0.8;   // diferencia total ancho frente-fondo en secciones trapezoidales
const FLOOR1_EXTRA = 0.27;  // altura extra del piso 1 (lobby de acceso)

// Altura real de cada piso (piso 1 = índice 2 tiene mayor altura)
function getFH(i) { return i === 2 ? FH + FLOOR1_EXTRA : FH; }

// Anchos de cara frontal (Z = +BD/2, lado calle) y posterior (Z = -BD/2) según índice
function getFloorWidths(i) {
  if (i >= 2 && i <= 6)  return { wF: BW - TRAP_TAPER, wB: BW };  // pisos 1-5: trapecio invertido
  if (i >= 23)           return { wF: BW, wB: BW - TRAP_TAPER };   // pisos 22-25: trapecio normal
  return { wF: BW, wB: BW };                                         // pisos 6-21: rectangular
}

// Genera geometría de losa con planta rectangular o trapezoidal isósceles.
// El Shape se define en plano X-Y y se extruye en Z; luego se rota -90° en X
// para que la planta quede en X-Z y la extrusión suba verticalmente en Y.
function makeFloorGeo(wF, wB, fh) {
  if (Math.abs(wF - wB) < 0.001) return new THREE.BoxGeometry(wF, fh, BD);
  const s = new THREE.Shape();
  // wF en Y = -BD/2 → después de rotar queda en Z = +BD/2 (cara frontal/calle)
  s.moveTo(-wF/2, -BD/2); s.lineTo(wF/2, -BD/2);
  s.lineTo(wB/2,   BD/2); s.lineTo(-wB/2, BD/2); s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: fh, bevelEnabled: false });
  geo.applyMatrix4(new THREE.Matrix4().makeRotationX(-Math.PI / 2));
  geo.applyMatrix4(new THREE.Matrix4().makeTranslation(0, -fh/2, 0));
  return geo;
}

// Posición Y acumulada de cada piso (el piso 1 más alto desplaza todos los superiores)
const floorY = [];
{ let _cy = 0; for (let i = 0; i < N; i++) { floorY.push(_cy); _cy += getFH(i) + BH; } }
const GROUND_Y = floorY[2];                    // nivel calle = base del piso 1
const TOTAL_H  = floorY[N-1] + getFH(N-1);    // altura total del edificio

// ── Scene ─────────────────────────────────────────────────────
const wrap = document.getElementById('three-wrap');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ab8d8);
scene.fog = new THREE.Fog(0x8ab8d8, 40, 90);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

// Environment map (glass reflections)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
pmrem.dispose();

// ── Lights ────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xc8dff0, 1.4));

const sun = new THREE.DirectionalLight(0xfff5e8, 3.2);
sun.position.set(8, 18, 10);
sun.castShadow = true;
sun.shadow.mapSize.setScalar(2048);
Object.assign(sun.shadow.camera, { near:1, far:55, left:-8, right:8, top:18, bottom:-3 });
scene.add(sun);

const skyFill = new THREE.DirectionalLight(0x88bbdd, 0.8);
skyFill.position.set(-6, 6, -10);
scene.add(skyFill);

// ── Materiales del edificio ───────────────────────────────────
// baseHex: color del vidrio según avance (amarillo=especial, azul=sin datos, verde/ámbar/rojo=avance)
const baseHex = (p, yellow) => yellow ? 0xffdd00 : !p ? 0x1a3060 : p >= 80 ? 0x00c46a : p >= 40 ? 0xffa000 : 0xd42020;

// mkGlass: crea material de vidrio físico con reflexiones y transparencia
// roughness=0.07 (muy liso), metalness=0.75 (reflectivo), opacity=0.92 (casi opaco)
const mkGlass = hex => new THREE.MeshPhysicalMaterial({
  color: hex, roughness: 0.07, metalness: 0.75,
  transparent: true, opacity: 0.92, envMapIntensity: 0.9,
});
// spandrelMat: banda oscura entre pisos (hormigón/aluminio oscuro)
const spandrelMat = new THREE.MeshStandardMaterial({ color: 0x040609, roughness: 0.95 });
// mullionMat: montantes verticales de la fachada (aluminio oscuro)
const mullionMat  = new THREE.MeshStandardMaterial({ color: 0x080d1a, roughness: 0.55, metalness: 0.9 });

// ── Floor label helper ────────────────────────────────────────
function makeLabel(text, p, yellow) {
  const c = document.createElement('canvas');
  c.width = 88; c.height = 44;
  const cx = c.getContext('2d');
  cx.fillStyle = '#ffffff';
  cx.font = 'bold 28px monospace';
  cx.textAlign = 'right';
  cx.textBaseline = 'middle';
  cx.fillText(text, 84, 22);
  const tex = new THREE.CanvasTexture(c);
  return new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, sizeAttenuation: true });
}

// ── Floors ────────────────────────────────────────────────────
const floorMeshes  = [];  // losa completa (estado uniforme)
const floorMeshesL = [];  // mitad izquierda (estado mixto – verde)
const floorMeshesR = [];  // mitad derecha   (estado mixto – amarillo)

FLOORS.forEach((f, i) => {
  const y  = floorY[i];
  const fh = getFH(i);
  const { wF, wB } = getFloorWidths(i);

  // Losa con planta rectangular o trapezoidal según sección del edificio
  const mesh = new THREE.Mesh(makeFloorGeo(wF, wB, fh), mkGlass(baseHex(f.p, f.yellow)));
  mesh.position.set(0, y + fh/2, 0);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.userData.idx = i;
  scene.add(mesh); floorMeshes.push(mesh);

  // Mitades para estado mixto (ancho promedio, forma rectangular aproximada)
  const wAvg = (wF + wB) / 2;
  const meshL = new THREE.Mesh(new THREE.BoxGeometry(wAvg/2, fh, BD), mkGlass(0x00c46a));
  meshL.position.set(-wAvg/4, y + fh/2, 0);
  meshL.castShadow = true; meshL.userData.idx = i; meshL.visible = false;
  scene.add(meshL); floorMeshesL.push(meshL);

  const meshR = new THREE.Mesh(new THREE.BoxGeometry(wAvg/2, fh, BD), mkGlass(0xffa000));
  meshR.position.set(wAvg/4, y + fh/2, 0);
  meshR.castShadow = true; meshR.userData.idx = i; meshR.visible = false;
  scene.add(meshR); floorMeshesR.push(meshR);

  // Spandrel con la misma planta trapezoidal que la losa (ligeramente más ancho)
  if (i < N - 1) {
    const band = new THREE.Mesh(makeFloorGeo(wF + 0.08, wB + 0.08, BH), spandrelMat);
    band.position.set(0, y + fh + BH/2, 0);
    band.castShadow = true; scene.add(band);
  }

  // Etiqueta número de piso (siempre junto a la cara más ancha del piso)
  const sprite = new THREE.Sprite(makeLabel(f.id, f.p, f.yellow));
  sprite.scale.set(0.58, 0.29, 1);
  sprite.position.set(Math.max(wF, wB)/2 + 0.46, y + fh/2, 0);
  scene.add(sprite);
});

// ── Montantes verticales de fachada (mullions) ────────────────
// Se dibujan sobre las caras frontal/trasera (eje Z) y laterales (eje X)
// Cambia los números del loop para más o menos columnas de aluminio
const mH = TOTAL_H + 0.05; // altura total del montante (igual que el edificio)

// 8 montantes en cara frontal y trasera (distribuidos en ancho BW)
for (let m = 0; m <= 7; m++) {
  const x = -BW / 2 + m * (BW / 7); // posición X equidistante
  for (const zo of [BD / 2 + 0.015, -(BD / 2 + 0.015)]) { // frente y atrás
    const ml = new THREE.Mesh(new THREE.BoxGeometry(0.045, mH, 0.05), mullionMat);
    ml.position.set(x, mH / 2, zo);
    scene.add(ml);
  }
}
// 6 montantes en caras laterales (distribuidos en profundidad BD)
for (let m = 0; m <= 5; m++) {
  const z = -BD / 2 + m * (BD / 5); // posición Z equidistante
  for (const xo of [BW / 2 + 0.015, -(BW / 2 + 0.015)]) { // izquierda y derecha
    const ml = new THREE.Mesh(new THREE.BoxGeometry(0.05, mH, 0.045), mullionMat);
    ml.position.set(xo, mH / 2, z);
    scene.add(ml);
  }
}

// ── Pretil de techo (parapet) ─────────────────────────────────
// Reborde perimetral oscuro que corona el edificio
const roofY = TOTAL_H; // Y donde termina el último piso
const parapet = new THREE.Mesh(
  new THREE.BoxGeometry(BW + 0.12, 0.14, BD + 0.12), // ligeramente más ancho que el edificio
  new THREE.MeshStandardMaterial({ color: 0x0a0f1c, roughness: 0.6, metalness: 0.85 })
);
parapet.position.set(0, roofY + 0.07, 0);
scene.add(parapet);

// ── Helipuerto (techo) ────────────────────────────────────────
const helY = roofY + 0.21; // altura base del helipuerto sobre el pretil

// Disco de concreto base del helipuerto
const helBase = new THREE.Mesh(
  new THREE.CylinderGeometry(1.08, 1.08, 0.1, 40), // radio=1.08, 40 segmentos = círculo suave
  new THREE.MeshStandardMaterial({ color: 0x141c26, roughness: 0.65, metalness: 0.3 })
);
helBase.position.set(0, helY + 0.05, 0);
helBase.castShadow = true;
scene.add(helBase);

// Anillo amarillo exterior del helipuerto
const helRing = new THREE.Mesh(
  new THREE.RingGeometry(0.88, 1.04, 40), // radio interno=0.88, externo=1.04
  new THREE.MeshBasicMaterial({ color: 0xddcc00, side: THREE.DoubleSide })
);
helRing.rotation.x = -Math.PI / 2; // acostado horizontal
helRing.position.set(0, helY + 0.11, 0);
scene.add(helRing);

// Disco central con letra "H" generada en canvas 2D
const hc = document.createElement('canvas'); hc.width = hc.height = 256;
const hx = hc.getContext('2d');
hx.strokeStyle = '#ddcc00'; hx.lineWidth = 14;
hx.beginPath(); hx.arc(128, 128, 100, 0, Math.PI * 2); hx.stroke(); // círculo
hx.fillStyle = '#ddcc00';
hx.font = 'bold 118px sans-serif';
hx.textAlign = 'center'; hx.textBaseline = 'middle';
hx.fillText('H', 128, 132); // letra H centrada

const helDisc = new THREE.Mesh(
  new THREE.CircleGeometry(0.86, 40),
  new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(hc), transparent: true })
);
helDisc.rotation.x = -Math.PI / 2;
helDisc.position.set(0, helY + 0.115, 0);
scene.add(helDisc);

// ── Letrero PDI — extremo derecho del piso 25 ────────────────
// Panel físico que sobresale de la fachada con el logo PDI
const signW = 1.2, signH = 0.52, signD = 0.14; // ancho, alto, profundidad del letrero
const signX = BW / 2 - signW / 2 - 0.06;       // alineado a la derecha del edificio
const signY = floorY[26] + getFH(26) / 2;        // centrado en el piso 25 (índice 26)
const signZ = BD / 2 + signD / 2 + 0.015;       // sobresale de la fachada frontal

// Caja de respaldo del letrero (color azul PDI)
const signBox = new THREE.Mesh(
  new THREE.BoxGeometry(signW, signH, signD),
  new THREE.MeshStandardMaterial({ color: 0x102B6B, roughness: 0.5, metalness: 0.85 })
);
signBox.position.set(signX, signY, signZ);
scene.add(signBox);

// Marco metálico perimetral del letrero (4 tiras delgadas)
const rimMat = new THREE.MeshStandardMaterial({ color: 0x2a2e38, roughness: 0.4, metalness: 0.95 });
[
  { w: signW, h: 0.03, x: 0,                   y:  signH / 2 - 0.015 }, // borde superior
  { w: signW, h: 0.03, x: 0,                   y: -signH / 2 + 0.015 }, // borde inferior
  { w: 0.03,  h: signH, x: -signW / 2 + 0.015, y: 0 },                  // borde izquierdo
  { w: 0.03,  h: signH, x:  signW / 2 - 0.015, y: 0 },                  // borde derecho
].forEach(({ w, h, x, y }) => {
  const rim = new THREE.Mesh(new THREE.BoxGeometry(w, h, signD + 0.01), rimMat);
  rim.position.set(signX + x, signY + y, signZ);
  scene.add(rim);
});

// Logo PDI: SVG inline convertido a base64 → textura Three.js
// Para cambiar el logo modificar el SVG dentro del template literal
const pdiSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220">
  <rect width="600" height="220" fill="#102B6B"/>
  <text x="300" y="178"
    font-family="Georgia,'Palatino Linotype',serif"
    font-size="188" font-weight="bold"
    fill="#F5C200" text-anchor="middle" letter-spacing="6">PDI</text>
</svg>`;
const pdiUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(pdiSvg)));
const pdiTex = new THREE.TextureLoader().load(pdiUrl);
const pdiText = new THREE.Mesh(
  new THREE.PlaneGeometry(signW - 0.01, signH - 0.01),
  new THREE.MeshBasicMaterial({ map: pdiTex })
);
pdiText.position.set(signX, signY, signZ + signD / 2 + 0.002); // pegado a la cara frontal
scene.add(pdiText);

// ── Suelo / terreno ───────────────────────────────────────────
// Plano gris oscuro de 80×80 unidades que recibe sombras
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ color: 0x2a2e34, roughness: 1.0 })
);
ground.rotation.x = -Math.PI / 2; // acostado horizontal
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

// ── Banda perimetral en nivel de calle (marca inicio subterráneo) ──
// 4 franjas que forman un marco alrededor de la base del edificio a la altura de GROUND_Y
// Indica visualmente dónde terminan los pisos sobre tierra y empiezan los subterráneos
const periMat = new THREE.MeshStandardMaterial({ color: 0x1c2a3a, roughness: 0.8, metalness: 0.5 });
const periH = 0.10;  // altura de la franja (10 cm en escala real)
const periE = 0.28;  // extensión hacia afuera desde la fachada
const periY = GROUND_Y - periH / 2;
[
  { w: BW + periE * 2, d: periE, x: 0,                  z:  BD / 2 + periE / 2 }, // franja frontal
  { w: BW + periE * 2, d: periE, x: 0,                  z: -(BD / 2 + periE / 2) }, // franja trasera
  { w: periE,          d: BD,    x:  BW / 2 + periE / 2, z: 0 }, // franja lateral derecha
  { w: periE,          d: BD,    x: -(BW / 2 + periE / 2), z: 0 }, // franja lateral izquierda
].forEach(({ w, d, x, z }) => {
  const s = new THREE.Mesh(new THREE.BoxGeometry(w, periH, d), periMat);
  s.position.set(x, periY, z);
  s.receiveShadow = true;
  scene.add(s);
});

// ── Bigas laterales estructurales ─────────────────────────────
// Pilastras de hormigón visibles en los lados de las secciones trapezoidales
// (pisos 1-5 y pisos 22-25), igual que en el Edificio Metlife real
const beamMat = new THREE.MeshStandardMaterial({ color: 0x0b1520, roughness: 0.7, metalness: 0.55 });
const pillarW = 0.32;         // ancho de la pilastra
const pillarD = BD + 0.12;   // profundidad: cubre toda la cara lateral + pequeño vuelo

// Pilastras sección superior — pisos 22-25 (frente ancho BW, fondo estrecho BW-TRAP_TAPER)
// Se ubican en x = ±BW/2 (borde de la cara frontal más ancha)
const topSecH = (floorY[26] + getFH(26)) - floorY[23];
const topSecY = floorY[23] + topSecH / 2;
[-1, 1].forEach(side => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(pillarW, topSecH, pillarD), beamMat);
  b.position.set(side * BW / 2, topSecY, 0);
  scene.add(b);
});

// Pilastras sección inferior — pisos 1-5 (frente estrecho BW-TRAP_TAPER, fondo ancho BW)
// Se ubican en x = ±BW/2 (borde de la cara posterior más ancha, visible en lateral)
const botSecH = (floorY[6] + getFH(6)) - floorY[2];
const botSecY = floorY[2] + botSecH / 2;
[-1, 1].forEach(side => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(pillarW, botSecH, pillarD), beamMat);
  b.position.set(side * BW / 2, botSecY, 0);
  scene.add(b);
});

// ── Camera & controls ─────────────────────────────────────────
const midY = TOTAL_H / 2;
camera.position.set(-5, midY + 2.5, 16);
camera.lookAt(0, midY, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, midY, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.minDistance = 5;
controls.maxDistance = 45;
controls.update();

// ── Interaction ───────────────────────────────────────────────
let hovIdx = -1, selIdx = -1;
const ray = new THREE.Raycaster();
const mp  = new THREE.Vector2();

function getHit(e) {
  const r = renderer.domElement.getBoundingClientRect();
  mp.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mp, camera);
  // Incluye las mitades visibles para que el click funcione en estado mixto
  const hittable = [...floorMeshes, ...floorMeshesL, ...floorMeshesR].filter(m => m.visible);
  const hits = ray.intersectObjects(hittable);
  return hits.length ? hits[0].object.userData.idx : -1;
}

// Retorna 'mixed' si hay al menos una Operativa y una en otro estado, si no el estado general
function floorPrinterMix(floorId) {
  const ps = PRINTERS.filter(p => p.piso === floorId);
  if (!ps.length) return 'empty';
  const hasOp    = ps.some(p => p.estado === 'Operativa');
  const hasNonOp = ps.some(p => p.estado !== 'Operativa');
  return hasOp && hasNonOp ? 'mixed' : hasOp ? 'all_op' : 'in_progress';
}

function setFloorState(idx, state) {
  const mix     = floorPrinterMix(FLOORS[idx].id);
  const white   = new THREE.Color(0xffffff);
  const lerp    = state === 'sel' ? 0.30 : state === 'hov' ? 0.18 : 0;
  const emissH  = state === 'sel' ? 0x003344 : 0x000000;
  const emissI  = state === 'sel' ? 0.22 : 0;
  const opacity = state === 'sel' ? 1.0 : 0.92;

  const applyMat = (mat, hex) => {
    mat.color.copy(new THREE.Color(hex).lerp(white, lerp));
    mat.emissive.setHex(emissH);
    mat.emissiveIntensity = emissI;
    mat.opacity = opacity;
  };

  if (mix === 'mixed') {
    // Dos meshes separados: cada cara lateral queda con su color correcto
    floorMeshes[idx].visible  = false;
    floorMeshesL[idx].visible = true;
    floorMeshesR[idx].visible = true;
    applyMat(floorMeshesL[idx].material, 0x00c46a); // izquierda = verde
    applyMat(floorMeshesR[idx].material, 0xffa000); // derecha   = amarillo
  } else {
    floorMeshes[idx].visible  = true;
    floorMeshesL[idx].visible = false;
    floorMeshesR[idx].visible = false;
    const effP = floorEffectiveP(FLOORS[idx].id);
    const base = effP > 0
      ? (effP >= 80 ? 0x00c46a : 0xffa000)
      : baseHex(FLOORS[idx].p, FLOORS[idx].yellow);
    applyMat(floorMeshes[idx].material, base);
  }
}

// Refresca el color 3D de un piso tras cambios en sus impresoras
function refresh3DFloor(floorId) {
  const i = FLOORS.findIndex(f => f.id === floorId);
  if (i < 0) return;
  setFloorState(i, i === selIdx ? 'sel' : i === hovIdx ? 'hov' : 'normal');
}

// Aplicar colores iniciales según impresoras ya cargadas desde Supabase
FLOORS.forEach(f => refresh3DFloor(f.id));

renderer.domElement.addEventListener('mousemove', e => {
  const idx = getHit(e);
  if (idx === hovIdx) return;
  if (hovIdx >= 0 && hovIdx !== selIdx) setFloorState(hovIdx, 'normal');
  hovIdx = idx;
  if (hovIdx >= 0 && hovIdx !== selIdx) setFloorState(hovIdx, 'hov');
  renderer.domElement.style.cursor = idx >= 0 ? 'pointer' : 'default';
});

renderer.domElement.addEventListener('click', e => {
  const idx = getHit(e);
  if (idx < 0) return;
  if (selIdx >= 0) setFloorState(selIdx, selIdx === hovIdx ? 'hov' : 'normal');
  selIdx = selIdx === idx ? -1 : idx;
  if (selIdx >= 0) setFloorState(selIdx, 'sel');
  showDetail(selIdx >= 0 ? FLOORS[selIdx] : null);
});

// ── Resize ────────────────────────────────────────────────────
function onResize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
onResize();
new ResizeObserver(onResize).observe(wrap);

// ── Render loop ───────────────────────────────────────────────
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

// ── Detail panel ─────────────────────────────────────────────
const HITOS = ['Levantamiento', 'Instalación', 'Configuración'];
const STATE_COLOR = { completado:'#00e676', en_progreso:'#ffaa00' };
const STATE_LABEL = { completado:'Completado', en_progreso:'En proceso' };
const hitoState  = (p, i) => p >= (i+1) * (100/3) ? 'completado' : 'en_progreso';
const floorColor  = p => !p ? '#8a9ab0' : p >= 80 ? '#00e676' : '#ffaa00';
const floorStatus = p => !p ? 'Sin datos' : p >= 80 ? 'Completado' : 'En proceso';

function showDetail(floor) {
  const ph  = document.getElementById('placeholder');
  const det = document.getElementById('detail');
  if (!floor) {
    ph.classList.remove('opacity-0');
    det.classList.add('opacity-0', 'pointer-events-none');
    return;
  }
  ph.classList.add('opacity-0');
  det.classList.remove('opacity-0', 'pointer-events-none');

  const effP = floorEffectiveP(floor.id);
  const c = floorColor(effP), st = floorStatus(effP);
  const printers = PRINTERS.filter(p => p.piso === floor.id);

  const printerRows = printers.map(p => {
    const pi = PRINTERS.indexOf(p);
    const pe = PESTADOS[p.estado] || PESTADOS['Planificada'];
    return `<tr>
      <td class="font-mono font-semibold" style="color:#c0cad4">${p.hh}</td>
      <td><div style="color:#c0cad4;font-weight:500">${p.marca}</div><div style="font-size:11px;color:#545e6a">${p.modelo}</div></td>
      <td class="font-mono" style="font-size:11px">${p.serie || '—'}</td>
      <td><a href="http://${p.ip}" target="_blank" class="font-mono" style="font-size:11px;color:#00d4ff;text-decoration:none" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${p.ip}</a></td>
      <td>${p.area}</td>
      <td><span style="font-size:11px;padding:2px 7px;border-radius:4px;background:#ffffff0a;color:#7a8898">${p.tipo === 'P2P' ? 'P2P' : 'Servidor'}</span></td>
      <td><span style="display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:10px;font-weight:700;color:${pe.color};background:${pe.bg};border:1px solid ${pe.color}33">
        <span style="width:5px;height:5px;border-radius:50%;background:${pe.color};display:inline-block;flex-shrink:0"></span>${p.estado}
      </span></td>
      <td style="white-space:nowrap">
        <button class="act-btn" onclick="window._openModal('${floor.id}',${pi})">✎</button>
        <button class="act-btn danger" onclick="window._deleteP(${pi},'${floor.id}')">✕</button>
      </td>
    </tr>`;
  }).join('');

  det.innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3">
        <h2 class="text-[22px] font-bold text-[#d8e0e8]">Piso ${floor.id}</h2>
        <span class="px-3 py-0.5 rounded-full text-[11px] font-bold border" style="color:${c};background:${c}18;border-color:${c}40">${st}</span>
      </div>
      <span class="text-[22px] font-black" style="color:${c}">${effP}%</span>
    </div>
    <div class="d-bar mb-5"><div class="d-fill" style="width:${effP}%;background:${c};box-shadow:0 0 10px ${c}55"></div></div>
    <div class="grid grid-cols-4 gap-2 mb-6">
      ${HITOS.map((h, i) => {
        const s = hitoState(effP, i), hc = STATE_COLOR[s];
        return `<div class="d-card" style="padding:10px">
          <div class="text-[10px] font-medium mb-1.5" style="color:#484f5c">${h}</div>
          <div class="flex items-center gap-1.5 text-[11px] font-semibold">
            <div class="w-1.5 h-1.5 rounded-full" style="background:${hc}"></div>
            <span style="color:${hc}">${STATE_LABEL[s]}</span>
          </div></div>`;
      }).join('')}
    </div>
    <div class="flex items-center justify-between mb-3">
      <div class="d-tag" style="margin-bottom:0">Impresoras &middot; ${printers.length}</div>
      <button class="btn" style="padding:4px 12px;font-size:12px;color:#00d4ff;border-color:rgba(0,212,255,.25)" onclick="window._openModal('${floor.id}',-1)">+ Agregar</button>
    </div>
    ${printers.length === 0
      ? `<div style="text-align:center;padding:32px 0;color:#2a2e3c;font-size:13px">Sin impresoras registradas para este piso</div>`
      : `<div style="overflow-x:auto"><table class="p-table">
          <thead><tr>
            <th>HH</th><th>Marca / Modelo</th><th>Serie</th><th>IP</th><th>Área</th><th>Tipo</th><th>Estado</th><th></th>
          </tr></thead>
          <tbody>${printerRows}</tbody>
        </table></div>`
    }`;
}

// ── Modal ─────────────────────────────────────────────────────
let _editIdx = -1, _modalPiso = '';

window._openModal = function(piso, idx) {
  _editIdx = idx;
  _modalPiso = piso;
  const isEdit = idx >= 0;
  const p = isEdit ? PRINTERS[idx] : { hh:'', serie:'', marca:'', modelo:'', ip:'', piso, area:'', tipo:'P2P', estado:'Planificada' };
  document.getElementById('modal-title').textContent = isEdit ? 'Editar impresora' : 'Agregar impresora';
  document.getElementById('modal-form').innerHTML = `
    <div class="form-row">
      <div class="form-group"><label class="form-label">Identificador HH</label>
        <input id="fi-hh" class="form-input" placeholder="HH-001" value="${p.hh}"></div>
      <div class="form-group"><label class="form-label">N° Serie <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#363d48">(opcional)</span></label>
        <input id="fi-serie" class="form-input" placeholder="SN..." value="${p.serie}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Marca</label>
        <input id="fi-marca" class="form-input" placeholder="HP, Epson..." value="${p.marca}"></div>
      <div class="form-group"><label class="form-label">Modelo</label>
        <input id="fi-modelo" class="form-input" placeholder="LaserJet..." value="${p.modelo}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Dirección IP</label>
        <input id="fi-ip" class="form-input" placeholder="10.x.x.x" value="${p.ip}"></div>
      <div class="form-group"><label class="form-label">Área / Departamento</label>
        <input id="fi-area" class="form-input" placeholder="Administración..." value="${p.area}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Tipo de conexión</label>
        <select id="fi-tipo" class="form-input">
          <option value="P2P"${p.tipo==='P2P'?' selected':''}>Punto a punto (P2P)</option>
          <option value="Servidor"${p.tipo==='Servidor'?' selected':''}>Servidor de impresión</option>
        </select></div>
      <div class="form-group"><label class="form-label">Estado</label>
        <select id="fi-estado" class="form-input">
          ${PESTADO_LIST.map(e=>`<option value="${e}"${p.estado===e?' selected':''}>${e}</option>`).join('')}
        </select></div>
    </div>
    <div class="form-group"><label class="form-label">Piso</label>
      <select id="fi-piso" class="form-input">
        ${FLOORS.map(f=>`<option value="${f.id}"${(isEdit?p.piso:piso)===f.id?' selected':''}>Piso ${f.id}</option>`).join('')}
      </select></div>`;
  document.getElementById('modal').classList.remove('hidden');
};

window._closeModal = function() {
  document.getElementById('modal').classList.add('hidden');
};

window._saveModal = async function() {
  const g = id => document.getElementById(id).value.trim();
  const hh = g('fi-hh'), ip = g('fi-ip');
  if (!hh || !ip) { alert('Identificador HH e IP son obligatorios.'); return; }
  const entry = { hh, serie:g('fi-serie')||null, marca:g('fi-marca'), modelo:g('fi-modelo'),
    ip, piso:g('fi-piso'), area:g('fi-area'), tipo:g('fi-tipo'), estado:g('fi-estado') };

  if (_editIdx >= 0) {
    const { error } = await db.from('impresoras').update(entry).eq('id', PRINTERS[_editIdx].id);
    if (error) { alert('Error al guardar: ' + error.message); return; }
    PRINTERS[_editIdx] = { ...PRINTERS[_editIdx], ...entry };
  } else {
    const { data, error } = await db.from('impresoras').insert(entry).select().single();
    if (error) { alert('Error al guardar: ' + error.message); return; }
    PRINTERS.push(data);
  }
  window._closeModal();
  refresh3DFloor(entry.piso);
  if (selIdx >= 0) showDetail(FLOORS[selIdx]);
};

window._deleteP = async function(idx) {
  const pisoId = PRINTERS[idx].piso;
  if (!confirm(`¿Eliminar impresora ${PRINTERS[idx].hh}?`)) return;
  const { error } = await db.from('impresoras').delete().eq('id', PRINTERS[idx].id);
  if (error) { alert('Error al eliminar: ' + error.message); return; }
  PRINTERS.splice(idx, 1);
  refresh3DFloor(pisoId);
  if (selIdx >= 0) showDetail(FLOORS[selIdx]);
};
</script>

<!-- ── Modal de alta / edición de impresora ──
     Se muestra al hacer clic en "+ Agregar" o en el ícono de edición de una fila.
     El overlay oscuro cierra el modal al hacer clic fuera del cuadro. -->
<div id="modal" class="hidden modal-overlay" onclick="if(event.target===this)window._closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between mb-5">
      <h3 id="modal-title" class="text-base font-bold text-[#d8e0e8]">Agregar impresora</h3>
      <button onclick="window._closeModal()" style="background:none;border:none;color:#545e6a;font-size:22px;cursor:pointer;line-height:1;padding:0">&times;</button>
    </div>
    <div id="modal-form"></div>
    <div class="flex justify-end gap-2 mt-5">
      <button onclick="window._closeModal()" class="btn">Cancelar</button>
      <button onclick="window._saveModal()" class="btn active">Guardar</button>
    </div>
  </div>
</div>
</body>
</html>
