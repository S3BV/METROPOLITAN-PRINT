<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metropolitan Print</title>
</head>
<body class="bg-bg text-[#c0cad4] h-screen overflow-hidden font-[system-ui,sans-serif]">

<nav class="h-12 bg-nav border-b border-[#26272f] flex items-center px-5 gap-0.5">
  <button class="btn">Dashboard</button>
  <button class="btn active">Por piso</button>
  <button class="btn">Historial</button>
</nav>

<div class="flex gap-4 p-4 h-[calc(100vh-48px)]">

  <div id="three-wrap" class="shrink-0 w-[380px] rounded-xl overflow-hidden relative bg-[#0c1018]">
    <div class="absolute top-3 right-3 z-10 text-[10px] text-[#2a3040] pointer-events-none text-right leading-5">
      Scroll · zoom<br>Drag · rotar<br>
      <span id="zoom-pct" style="color:#1e2a38">Zoom · 100%</span>
    </div>
    <button onclick="window._resetCamera()" style="position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;font-size:10px;color:#7a8899;background:rgba(10,14,20,0.75);border:1px solid #1e2a38;border-radius:6px;padding:4px 12px;cursor:pointer;letter-spacing:.02em;" onmouseover="this.style.color='#c0cad4';this.style.borderColor='#2e4255'" onmouseout="this.style.color='#7a8899';this.style.borderColor='#1e2a38'">↺ Posición inicial</button>
  </div>

  <div class="flex-1 bg-surface border border-border rounded-xl overflow-hidden relative">
    <div id="placeholder" class="absolute inset-0 flex items-center justify-center gap-2.5 text-subtle text-sm pointer-events-none transition-opacity duration-200">
      <span class="text-xl opacity-40">←</span>
      <span>Haz clic en un piso del edificio</span>
    </div>
    <div id="detail" class="absolute inset-0 p-7 overflow-y-auto opacity-0 pointer-events-none transition-opacity duration-300"></div>
  </div>

</div>

<div id="modal" class="hidden modal-overlay">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between mb-5">
      <h3 id="modal-title" class="text-base font-bold text-[#d8e0e8]">Agregar impresora</h3>
      <button onclick="window._closeModal()" style="background:none;border:none;color:#545e6a;font-size:22px;cursor:pointer;line-height:1;padding:0">&times;</button>
    </div>
    <div id="modal-form"></div>
    <div class="flex justify-end gap-2 mt-5">
      <button onclick="window._closeModal()" class="btn">Cancelar</button>
      <button onclick="window._saveModal()" class="btn active">Guardar</button>
    </div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
