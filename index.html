<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metropolitan Print</title>
</head>
<body class="bg-bg text-[#c0cad4] h-screen overflow-hidden font-[system-ui,sans-serif]">

<nav class="h-12 bg-nav border-b border-[#26272f] flex items-center px-5 gap-0.5">
  <button class="btn active" data-tab="dashboard" onclick="window._switchTab('dashboard')">Dashboard</button>
  <button class="btn" data-tab="por-piso" onclick="window._switchTab('por-piso')">Por piso</button>
  <button class="btn" data-tab="historial" onclick="window._switchTab('historial')">Historial</button>
  <div class="flex-1"></div>
  <button onclick="window._openSettings()" title="Ajustes" style="background:none;border:none;color:#363d48;cursor:pointer;font-size:16px;padding:4px 6px;border-radius:6px;line-height:1;transition:color .15s" onmouseover="this.style.color='#c0cad4'" onmouseout="this.style.color='#363d48'">⚙</button>
</nav>

<!-- Layout principal: visor 3D siempre visible + panel derecho intercambiable -->
<div class="flex flex-col md:flex-row gap-3 md:gap-4 p-3 md:p-4 h-[calc(100dvh-48px)]">

  <!-- Visor 3D — persiste en todos los tabs -->
  <div id="three-wrap" class="shrink-0 w-full h-[42vh] md:w-[380px] md:h-auto rounded-xl overflow-hidden relative bg-[#0c1018]">
    <div class="absolute top-3 right-3 z-10 text-[10px] text-[#2a3040] pointer-events-none text-right leading-5">
      <span class="hidden md:inline">Scroll · zoom<br>Drag · rotar</span>
      <span class="md:hidden">Pellizca · zoom<br>Arrastra · rotar</span>
      <br><span id="zoom-pct" style="color:#1e2a38">Zoom · 100%</span>
    </div>
    <button onclick="window._resetCamera()" style="position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;font-size:10px;color:#7a8899;background:rgba(10,14,20,0.75);border:1px solid #1e2a38;border-radius:6px;padding:6px 16px;cursor:pointer;letter-spacing:.02em;" onmouseover="this.style.color='#c0cad4';this.style.borderColor='#2e4255'" onmouseout="this.style.color='#7a8899';this.style.borderColor='#1e2a38'">↺ Posición inicial</button>
  </div>

  <!-- Panel derecho — contenido según tab activo -->
  <div class="flex-1 min-h-0 bg-surface border border-border rounded-xl overflow-hidden relative">

    <!-- Panel: Dashboard -->
    <div id="panel-dashboard" class="absolute inset-0">
      <div id="placeholder" class="absolute inset-0 flex items-center justify-center gap-2.5 text-subtle text-sm pointer-events-none transition-opacity duration-200">
        <span class="text-xl opacity-40 md:inline hidden">←</span>
        <span class="md:hidden opacity-40">↑</span>
        <span>Toca un piso del edificio</span>
      </div>
      <div id="detail" class="absolute inset-0 p-4 md:p-7 overflow-y-auto opacity-0 pointer-events-none transition-opacity duration-300"></div>
    </div>

    <!-- Panel: Por piso -->
    <div id="panel-por-piso" class="absolute inset-0 overflow-y-auto p-4 md:p-6" style="display:none">
      <div id="por-piso-content"></div>
    </div>

    <!-- Panel: Historial -->
    <div id="panel-historial" class="absolute inset-0 flex items-center justify-center" style="display:none">
      <span style="color:#2a3040;font-size:13px">En desarrollo</span>
    </div>

  </div>

</div>

<div id="modal" class="hidden modal-overlay">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="flex items-center justify-between mb-5">
      <h3 id="modal-title" class="text-base font-bold text-[#d8e0e8]">Agregar impresora</h3>
      <button onclick="window._closeModal()" style="background:none;border:none;color:#545e6a;font-size:22px;cursor:pointer;line-height:1;padding:0">&times;</button>
    </div>
    <div id="modal-form"></div>
    <div class="flex justify-end gap-2 mt-5">
      <button onclick="window._closeModal()" class="btn">Cancelar</button>
      <button onclick="window._saveModal()" class="btn active">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal: Ajustes / Catálogo de modelos -->
<div id="settings-modal" class="hidden modal-overlay">
  <div class="modal-box" onclick="event.stopPropagation()" style="width:480px">
    <div class="flex items-center justify-between mb-5">
      <h3 class="text-base font-bold text-[#d8e0e8]">Catálogo de modelos</h3>
      <button onclick="window._closeSettings()" style="background:none;border:none;color:#545e6a;font-size:22px;cursor:pointer;line-height:1;padding:0">&times;</button>
    </div>
    <div id="settings-modelos-list" style="margin-bottom:20px;display:flex;flex-direction:column;gap:6px"></div>
    <div style="border-top:1px solid #1e2530;padding-top:16px">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#545e6a;margin-bottom:10px">Agregar modelo</div>
      <div class="form-row" style="margin-bottom:10px">
        <div class="form-group"><label class="form-label">Marca</label>
          <input id="new-marca" class="form-input" placeholder="HP, Epson…"></div>
        <div class="form-group"><label class="form-label">Modelo</label>
          <input id="new-modelo" class="form-input" placeholder="LaserJet MFP E62555"></div>
      </div>
      <div class="form-group" style="margin-bottom:14px"><label class="form-label">Tipo por defecto <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#363d48">(opcional)</span></label>
        <select id="new-tipo" class="form-input">
          <option value="">— Sin preferencia —</option>
          <option value="P2P">Punto a punto (P2P)</option>
          <option value="Servidor">Servidor de impresión</option>
        </select>
      </div>
      <div class="flex justify-end">
        <button onclick="window._saveNewModelo()" class="btn active">Agregar al catálogo</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
